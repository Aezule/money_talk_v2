name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Front (lint → test → build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money_talk_front
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money_talk_front/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (unit + integration) + couverture
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-front
          path: money_talk_front/coverage/lcov.info

      - name: Build
        run: npm run build

  api:
    name: API Go (lint → test → build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money_talk_api_go
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: money_talk_api_go/go.mod
          cache-dependency-path: money_talk_api_go/go.sum

      - name: Lint (gofmt + go vet)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés (gofmt) :"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Seed MongoDB
        run: |
          docker exec ${{ job.services.mongo.id }} mongosh moneytalks --quiet --eval '
            db.transactions.insertOne({
              _id: ObjectId("6ae352026d8d526402e487b5"),
              id: "6ae352026d8d526402e487b5",
              userId: "ci-user",
              amount: 1234,
              type: "expense",
              date: new Date(),
              description: "transaction de test CI",
              isRecurring: false,
              createdAt: new Date(),
              updatedAt: new Date()
            })'

      - name: Tests + couverture
        run: go test -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: money_talk_api_go/coverage.out

      - name: Build
        run: go build ./...

  sonar:
    name: SonarCloud
    needs: [front, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: actions/download-artifact@v4
        with:
          name: coverage-front
          path: money_talk_front/coverage

      - uses: actions/download-artifact@v4
        with:
          name: coverage-api
          path: money_talk_api_go

      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
