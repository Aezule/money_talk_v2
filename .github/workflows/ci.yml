name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  OSV_SCANNER_VERSION: 2.7.0

jobs:
  # ── Qualité : SonarCloud (check requis par le ruleset de main) ──────────────
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier le token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Secret SONAR_TOKEN absent : à créer dans Settings → Secrets and variables → Actions (token sonarcloud.io)."
            exit 1
          fi

      - uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── 1a. CVE : dépendances npm (package-lock) + Go (go.mod) ──────────────────
  cve:
    name: CVE (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go est requis pour l'analyse d'appels (govulncheck) côté API
      - uses: actions/setup-go@v5
        with:
          go-version-file: money_talk_api_go/go.mod
          cache-dependency-path: money_talk_api_go/go.sum

      - name: Install osv-scanner
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x osv-scanner

      # Rapport complet dans les logs (toutes sévérités), ne bloque jamais
      - name: Scan (rapport)
        run: ./osv-scanner scan source -r . || true

      # Bloque uniquement sur High / Critical (CVSS >= 7.0)
      # Exceptions justifiées : osv-scanner.toml dans le dossier concerné
      - name: Bloquer sur High / Critical
        run: |
          set +e
          ./osv-scanner scan source -r . --format json --output osv.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "osv-scanner a échoué (code $code)"
            exit "$code"
          fi
          blocking=$(jq -r '
            [ .results[]?.packages[]? as $p
              | $p.groups[]?
              | select((.max_severity // "") != "" and (.max_severity | tonumber) >= 7)
              | "\($p.package.name)@\($p.package.version)  \(.ids | join(", "))  CVSS \(.max_severity)"
            ] | unique | .[]' osv.json)
          if [ -n "$blocking" ]; then
            echo "::error::Vulnérabilités High/Critical détectées"
            echo "$blocking"
            exit 1
          fi
          echo "Aucune vulnérabilité High/Critical."

  # ── 1b. Secrets : scan de tout le repo (historique git compris) ─────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Scan
        run: ./gitleaks git . --redact --verbose

  # ── 2a. Front : lint → test ─────────────────────────────────────────────────
  front-lint:
    name: Front · Lint
    needs: [gitleaks, cve]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money_talk_front
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money_talk_front/package-lock.json
      - run: npm ci
      - run: npm run lint

  front-test:
    name: Front · Test
    needs: front-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money_talk_front
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money_talk_front/package-lock.json
      - run: npm ci
      - run: npm test

  # ── 2b. API Go : lint → test ────────────────────────────────────────────────
  api-lint:
    name: API · Lint
    needs: [gitleaks, cve]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money_talk_api_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: money_talk_api_go/go.mod
          cache-dependency-path: money_talk_api_go/go.sum
      - name: gofmt + go vet
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés (gofmt) :"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

  api-test:
    name: API · Test
    needs: api-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money_talk_api_go
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: money_talk_api_go/go.mod
          cache-dependency-path: money_talk_api_go/go.sum
      - name: Seed MongoDB
        run: |
          docker exec ${{ job.services.mongo.id }} mongosh moneytalks --quiet --eval '
            db.transactions.insertOne({
              _id: ObjectId("6ae352026d8d526402e487b5"),
              id: "6ae352026d8d526402e487b5",
              userId: "ci-user",
              amount: 1234,
              type: "expense",
              date: new Date(),
              description: "transaction de test CI",
              isRecurring: false,
              createdAt: new Date(),
              updatedAt: new Date()
            })'
      - run: go test ./...

  # ── 3. Build des deux projets en parallèle, une fois tous les tests verts ───
  front-build:
    name: Front · Build
    needs: [front-test, api-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money_talk_front
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: money_talk_front/package-lock.json
      - run: npm ci
      - run: npm run build

  api-build:
    name: API · Build
    needs: [front-test, api-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money_talk_api_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: money_talk_api_go/go.mod
          cache-dependency-path: money_talk_api_go/go.sum
      - run: go build ./...
